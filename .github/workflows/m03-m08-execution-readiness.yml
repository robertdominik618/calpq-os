name: M03-M08 Execution Readiness

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  readiness:
    name: M03-M08 execution readiness
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run M03-M08 execution readiness guard
        shell: bash
        run: bash tests/m03_m08_execution_readiness_test.sh
