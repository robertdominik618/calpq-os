name: M05 Slice 10 Integration Evidence

on:
  pull_request:
    branches:
      - planning/program-execution-m09-m12
  workflow_dispatch:

permissions:
  contents: read

jobs:
  m05-s10-integration:
    name: M05 S10 mixed channels outages and S01-S10 runtime ledger
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact implementation head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Set up pinned Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: .node-version
          check-latest: false
      - name: Run composed integration and runtime ledger evidence
        run: bash tests/m05_s10_integration_test.sh
