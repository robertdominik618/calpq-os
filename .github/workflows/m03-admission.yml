name: M03 Admission

on:
  push:
    paths:
      - 'docs/planning/M03_ADMISSION_RECORD.md'
      - 'docs/planning/m03-admission-decision.json'
      - 'docs/planning/M03_EXECUTION_PACKAGE.md'
      - 'docs/planning/M02_EXIT_EVIDENCE.md'
      - 'docs/planning/M03_PRODUCT_SURFACE_BASELINE.md'
      - 'docs/planning/M04_ADMISSION_RECORD.md'
      - 'docs/planning/m04-admission-decision.json'
      - 'docs/planning/M04_EXECUTION_PACKAGE.md'
      - 'docs/planning/M05_ADMISSION_RECORD.md'
      - 'docs/planning/m05-admission-decision.json'
      - 'docs/planning/M05_EXECUTION_PACKAGE.md'
      - 'docs/planning/M06_EXECUTION_PACKAGE.md'
      - 'docs/planning/M07_EXECUTION_PACKAGE.md'
      - 'docs/planning/M08_EXECUTION_PACKAGE.md'
      - 'tests/m03_admission_test.sh'
      - 'tests/m04_admission_test.sh'
      - 'tests/m05_admission_test.sh'
      - 'tests/m03_m08_execution_readiness_test.sh'
      - '.github/workflows/m03-admission.yml'
      - '.github/workflows/m04-admission.yml'
      - '.github/workflows/m05-admission.yml'
      - 'scripts/governance_lifecycle_phase.sh'
  pull_request:
    paths:
      - 'docs/planning/M03_ADMISSION_RECORD.md'
      - 'docs/planning/m03-admission-decision.json'
      - 'docs/planning/M03_EXECUTION_PACKAGE.md'
      - 'docs/planning/M02_EXIT_EVIDENCE.md'
      - 'docs/planning/M03_PRODUCT_SURFACE_BASELINE.md'
      - 'docs/planning/M04_ADMISSION_RECORD.md'
      - 'docs/planning/m04-admission-decision.json'
      - 'docs/planning/M04_EXECUTION_PACKAGE.md'
      - 'docs/planning/M05_ADMISSION_RECORD.md'
      - 'docs/planning/m05-admission-decision.json'
      - 'docs/planning/M05_EXECUTION_PACKAGE.md'
      - 'docs/planning/M06_EXECUTION_PACKAGE.md'
      - 'docs/planning/M07_EXECUTION_PACKAGE.md'
      - 'docs/planning/M08_EXECUTION_PACKAGE.md'
      - 'tests/m03_admission_test.sh'
      - 'tests/m04_admission_test.sh'
      - 'tests/m05_admission_test.sh'
      - 'tests/m03_m08_execution_readiness_test.sh'
      - '.github/workflows/m03-admission.yml'
      - '.github/workflows/m04-admission.yml'
      - '.github/workflows/m05-admission.yml'
      - 'scripts/governance_lifecycle_phase.sh'

permissions:
  contents: read

jobs:
  m03-admission:
    name: Verify M03 admission
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify M03 admission transition
        shell: bash
        run: bash tests/m03_admission_test.sh
      - name: Verify M03-M08 execution readiness remains coherent
        shell: bash
        run: bash tests/m03_m08_execution_readiness_test.sh
