name: FV-09 Document Intake

on:
  push:
    paths:
      - 'packages/application/**'
      - 'packages/core/**'
      - 'packages/adapters/**'
      - 'tests/fv08_migration_delivery_test.sh'
      - 'tests/fv09_document_intake_test.sh'
      - '.github/workflows/fv08-migration-delivery.yml'
      - '.github/workflows/fv09-document-intake.yml'
      - 'scripts/governance_lifecycle_phase.sh'
  pull_request:
    paths:
      - 'packages/application/**'
      - 'packages/core/**'
      - 'packages/adapters/**'
      - 'tests/fv08_migration_delivery_test.sh'
      - 'tests/fv09_document_intake_test.sh'
      - '.github/workflows/fv08-migration-delivery.yml'
      - '.github/workflows/fv09-document-intake.yml'
      - 'scripts/governance_lifecycle_phase.sh'

permissions:
  contents: read

jobs:
  fv09-document-intake:
    name: FV-09 immutable document intake
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js 24 LTS
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
      - name: Run FV-09 intake evidence
        shell: bash
        run: bash tests/fv09_document_intake_test.sh
