name: M04 Slice 10 Integration Evidence

on:
  push:
    paths:
      - 'packages/core/test/m04-s10-*'
      - 'packages/core/package.json'
      - 'packages/core/tsconfig.json'
      - 'docs/planning/M04_S10_*.md'
      - 'docs/planning/M04_EXECUTION_PACKAGE.md'
      - 'docs/planning/M04_ADMISSION_RECORD.md'
      - 'docs/planning/m04-admission-decision.json'
      - 'tests/m04_s10_integration_evidence_test.sh'
      - '.github/workflows/m04-s10-integration-evidence.yml'
      - 'scripts/governance_lifecycle_phase.sh'
  pull_request:
    paths:
      - 'packages/core/test/m04-s10-*'
      - 'packages/core/package.json'
      - 'packages/core/tsconfig.json'
      - 'docs/planning/M04_S10_*.md'
      - 'docs/planning/M04_EXECUTION_PACKAGE.md'
      - 'docs/planning/M04_ADMISSION_RECORD.md'
      - 'docs/planning/m04-admission-decision.json'
      - 'tests/m04_s10_integration_evidence_test.sh'
      - '.github/workflows/m04-s10-integration-evidence.yml'
      - 'scripts/governance_lifecycle_phase.sh'

permissions:
  contents: read

jobs:
  m04-s10-integration-evidence:
    name: M04 S10 representative profession integration evidence
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Node.js 24 LTS
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
      - name: Run M04 Slice 10 integration evidence
        shell: bash
        run: bash tests/m04_s10_integration_evidence_test.sh
