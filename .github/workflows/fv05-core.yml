name: FV-05 Credential Evidence

on:
  push:
    paths:
      - 'packages/core/**'
      - 'tests/fv01_core_primitives_test.sh'
      - 'tests/fv02_core_ports_test.sh'
      - 'tests/fv03_core_provenance_test.sh'
      - 'tests/fv04_transition_kernel_test.sh'
      - 'tests/fv05_credential_evidence_test.sh'
      - '.github/workflows/fv01-core.yml'
      - '.github/workflows/fv02-core.yml'
      - '.github/workflows/fv03-core.yml'
      - '.github/workflows/fv04-core.yml'
      - '.github/workflows/fv05-core.yml'
      - 'scripts/governance_lifecycle_phase.sh'
  pull_request:
    paths:
      - 'packages/core/**'
      - 'tests/fv01_core_primitives_test.sh'
      - 'tests/fv02_core_ports_test.sh'
      - 'tests/fv03_core_provenance_test.sh'
      - 'tests/fv04_transition_kernel_test.sh'
      - 'tests/fv05_credential_evidence_test.sh'
      - '.github/workflows/fv01-core.yml'
      - '.github/workflows/fv02-core.yml'
      - '.github/workflows/fv03-core.yml'
      - '.github/workflows/fv04-core.yml'
      - '.github/workflows/fv05-core.yml'
      - 'scripts/governance_lifecycle_phase.sh'

permissions:
  contents: read

jobs:
  fv05-core:
    name: FV-05 credential evidence
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js 24 LTS
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
      - name: Run FV-05 credential evidence
        shell: bash
        run: bash tests/fv05_credential_evidence_test.sh
