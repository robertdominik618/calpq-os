name: FV-15 Operational Resilience

on:
  push:
    paths:
      - 'packages/application/src/runtime/**'
      - 'packages/application/test/fv15-*'
      - 'packages/application/tsconfig.json'
      - 'tests/fv14_rest_openapi_test.sh'
      - 'tests/fv15_operational_resilience_test.sh'
      - '.github/workflows/fv14-rest-openapi.yml'
      - '.github/workflows/fv15-operational-resilience.yml'
      - 'scripts/governance_lifecycle_phase.sh'
  pull_request:
    paths:
      - 'packages/application/src/runtime/**'
      - 'packages/application/test/fv15-*'
      - 'packages/application/tsconfig.json'
      - 'tests/fv14_rest_openapi_test.sh'
      - 'tests/fv15_operational_resilience_test.sh'
      - '.github/workflows/fv14-rest-openapi.yml'
      - '.github/workflows/fv15-operational-resilience.yml'
      - 'scripts/governance_lifecycle_phase.sh'

permissions:
  contents: read

jobs:
  fv15-operational-resilience:
    name: FV-15 async retry reconciliation recovery
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js 24 LTS
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
      - name: Run FV-15 operational resilience evidence
        shell: bash
        run: bash tests/fv15_operational_resilience_test.sh
