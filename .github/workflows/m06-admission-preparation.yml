name: M06 Admission Preparation

on:
  pull_request:
    branches:
      - planning/program-execution-m09-m12
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preparation:
    name: M06 preparation-only guard and M04/M05 prerequisite evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact preparation head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Set up governed Node.js version
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: .node-version
          check-latest: false
      - name: Validate preparation and predecessor regressions
        run: bash tests/m06_admission_preparation_test.sh
