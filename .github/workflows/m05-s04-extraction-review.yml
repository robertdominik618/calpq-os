name: M05 Slice 04 Extraction Review

on:
  push:
    paths:
      - 'packages/application/src/extraction/**'
      - 'packages/application/test/m05-s04-*'
      - 'packages/application/package.json'
      - 'packages/application/tsconfig.json'
      - 'docs/planning/M05_S04_*.md'
      - 'docs/contracts/EXTRACTION_PROPOSAL_REVIEW_MODEL.md'
      - 'tests/m05_s04_extraction_review_test.sh'
      - 'tests/m05_s03_derived_extraction_test.sh'
      - 'tests/m05_s02_original_archive_test.sh'
      - 'tests/m05_s01_multi_channel_intake_test.sh'
      - 'tests/fv09_document_intake_test.sh'
      - 'tests/fv10_verification_test.sh'
      - 'tests/m05_admission_test.sh'
      - '.github/workflows/m05-s04-extraction-review.yml'
  pull_request:
    paths:
      - 'packages/application/src/extraction/**'
      - 'packages/application/test/m05-s04-*'
      - 'packages/application/package.json'
      - 'packages/application/tsconfig.json'
      - 'docs/planning/M05_S04_*.md'
      - 'docs/contracts/EXTRACTION_PROPOSAL_REVIEW_MODEL.md'
      - 'tests/m05_s04_extraction_review_test.sh'
      - 'tests/m05_s03_derived_extraction_test.sh'
      - 'tests/m05_s02_original_archive_test.sh'
      - 'tests/m05_s01_multi_channel_intake_test.sh'
      - 'tests/fv09_document_intake_test.sh'
      - 'tests/fv10_verification_test.sh'
      - 'tests/m05_admission_test.sh'
      - '.github/workflows/m05-s04-extraction-review.yml'

permissions:
  contents: read

jobs:
  m05-s04-extraction-review:
    name: M05 S04 immutable extraction review evidence
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Node.js 24 LTS
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
      - name: Run M05 Slice 04 evidence
        shell: bash
        run: bash tests/m05_s04_extraction_review_test.sh
