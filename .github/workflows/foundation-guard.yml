name: Foundation Guard

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  foundation-guard:
    name: Enforce M00 Foundation gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run Foundation Guard
        shell: bash
        run: bash scripts/foundation_guard.sh
      - name: Run Foundation Guard self-tests
        shell: bash
        run: bash tests/foundation_guard_test.sh
      - name: Check M00 release-state consistency
        shell: bash
        run: bash scripts/m00_release_gate.sh
      - name: Run M00 release-gate self-tests
        shell: bash
        run: bash tests/m00_release_gate_test.sh
      - name: Run architecture boundary tests
        shell: bash
        run: bash tests/architecture_boundaries_test.sh
      - name: Run M00 release eligibility self-test
        shell: bash
        run: bash tests/m00_release_authorization_test.sh
      - name: Run M01 contract-pack guard
        shell: bash
        run: bash tests/m01_contract_pack_test.sh
      - name: Run M01 credential-domain guard
        shell: bash
        run: bash tests/m01_credential_domain_test.sh
      - name: Run M01 passport-gap guard
        shell: bash
        run: bash tests/m01_passport_gap_test.sh
      - name: Run M01 B2B assignment guard
        shell: bash
        run: bash tests/m01_b2b_assignment_test.sh
      - name: Run M02 planning readiness guard
        shell: bash
        run: bash tests/m02_planning_readiness_test.sh
      - name: Run M03-M05 planning readiness guard
        shell: bash
        run: bash tests/m03_m05_planning_readiness_test.sh
      - name: Run M06-M08 planning readiness guard
        shell: bash
        run: bash tests/m06_m08_planning_readiness_test.sh
      - name: Run M09-M12 planning readiness guard
        shell: bash
        run: bash tests/m09_m12_planning_readiness_test.sh
