name: Foundation Guard
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  foundation-guard:
    name: Enforce M00 Foundation gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Run Foundation Guard
        run: bash scripts/foundation_guard.sh
      - name: Run Foundation Guard self-tests
        run: bash tests/foundation_guard_test.sh
      - name: Check M00 release-state consistency
        run: bash scripts/m00_release_gate.sh
      - name: Run M00 release-gate self-tests
        run: bash tests/m00_release_gate_test.sh
      - name: Run architecture boundary tests
        run: bash tests/architecture_boundaries_test.sh
