name: AI Economy Architecture Gate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  ai-economy-architecture:
    name: Enforce AI economic governance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run AI economy architecture gate
        shell: bash
        run: node scripts/ci/ai-economy-architecture-gate.mjs
      - name: Run AI economy architecture self-test
        shell: bash
        run: node tests/ai_economy_architecture_test.mjs
