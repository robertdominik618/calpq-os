name: M02 Batch A Manifest

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  manifest:
    name: M02 Batch A manifest readiness
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate Batch A implementation manifest
        shell: bash
        run: bash tests/m02_batch_a_manifest_test.sh
