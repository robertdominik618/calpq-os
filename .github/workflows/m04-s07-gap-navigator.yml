name: M04 Slice 07 Gap Navigator

on:
  push:
    paths:
      - 'packages/core/src/catalog/**'
      - 'packages/core/src/eligibility/**'
      - 'packages/core/src/credential/evidence-snapshot.ts'
      - 'packages/core/src/ids.ts'
      - 'packages/core/src/index.ts'
      - 'packages/core/package.json'
      - 'packages/core/tsconfig.json'
      - 'packages/core/test/m04-s07-*'
      - 'docs/contracts/GAP_NAVIGATOR_MODEL.md'
      - 'docs/prep/M01_PASSPORT_GAP_NAVIGATOR_BASELINE.md'
      - 'docs/prep/M01_PASSPORT_GAP_TEST_MATRIX.md'
      - 'docs/planning/M04_S07_*.md'
      - 'docs/planning/M04_EXECUTION_PACKAGE.md'
      - 'docs/planning/M04_ADMISSION_RECORD.md'
      - 'docs/planning/m04-admission-decision.json'
      - 'tests/m04_s07_gap_navigator_test.sh'
      - '.github/workflows/m04-s07-gap-navigator.yml'
      - 'scripts/governance_lifecycle_phase.sh'
  pull_request:
    paths:
      - 'packages/core/src/catalog/**'
      - 'packages/core/src/eligibility/**'
      - 'packages/core/src/credential/evidence-snapshot.ts'
      - 'packages/core/src/ids.ts'
      - 'packages/core/src/index.ts'
      - 'packages/core/package.json'
      - 'packages/core/tsconfig.json'
      - 'packages/core/test/m04-s07-*'
      - 'docs/contracts/GAP_NAVIGATOR_MODEL.md'
      - 'docs/prep/M01_PASSPORT_GAP_NAVIGATOR_BASELINE.md'
      - 'docs/prep/M01_PASSPORT_GAP_TEST_MATRIX.md'
      - 'docs/planning/M04_S07_*.md'
      - 'docs/planning/M04_EXECUTION_PACKAGE.md'
      - 'docs/planning/M04_ADMISSION_RECORD.md'
      - 'docs/planning/m04-admission-decision.json'
      - 'tests/m04_s07_gap_navigator_test.sh'
      - '.github/workflows/m04-s07-gap-navigator.yml'
      - 'scripts/governance_lifecycle_phase.sh'

permissions:
  contents: read

jobs:
  m04-s07-gap-navigator:
    name: M04 S07 deterministic Gap Navigator
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Node.js 24 LTS
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
      - name: Run M04 Slice 07 Gap Navigator evidence
        shell: bash
        run: bash tests/m04_s07_gap_navigator_test.sh
