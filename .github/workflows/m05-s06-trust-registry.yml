name: M05 Slice 06 Trust Registry

on:
  pull_request:
    branches:
      - planning/program-execution-m09-m12
  workflow_dispatch:

permissions:
  contents: read

jobs:
  m05-s06-trust-registry:
    name: M05 S06 trust registry and issuer/verifier identity resolution
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Node.js 24 LTS
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: .node-version
          check-latest: false
      - name: Run M05 Slice 06 evidence
        run: bash tests/m05_s06_trust_registry_test.sh
